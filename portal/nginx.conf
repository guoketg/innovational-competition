server {
    listen       80;
    server_name  localhost;

    # 入口页不缓存：确保每次都能拿到最新的跳转地址
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
